[workspace]
members = [
    "crates/memory-palace-core",
    "crates/memory-palace-protocol",
    "crates/memory-palace-sqlite",
    "crates/memory-palace-daemon",
    "crates/memory-palace-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/drbree82/hermes-memory-palace"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.37", features = ["bundled", "functions"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
uuid = { version = "1.18", features = ["serde", "v7"] }
zstd = "0.13"
